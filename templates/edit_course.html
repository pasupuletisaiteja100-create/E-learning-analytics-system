
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Course</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 30px;
        }

        .container {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Edit Course</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form
        method="POST"
        action="{{ url_for('edit_course', course_id=course.course_id) }}"
    >

        <label>Course Name</label>

        <input
            type="text"
            name="course_name"
            value="{{ course.course_name }}"
            required
        >

        <label>Category</label>

        <input
            type="text"
            name="category"
            value="{{ course.category }}"
            required
        >

        <button type="submit">Update Course</button>

    </form>

    <p>
        <a href="/courses">Back to Course Management</a>
    </p>

</div>

</body>
</html>
